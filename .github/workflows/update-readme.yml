name: Sync releases and update README

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [plugins.json, scripts/generate_readme.py]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/generate_readme.py
        env:
          # SOURCE_TOKEN: fine-grained PAT with read access to the plugin repos (needed once they are private)
          GH_TOKEN: ${{ secrets.SOURCE_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Sync latest releases"
            git push
          fi
